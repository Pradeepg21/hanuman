<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <!-- Bal Hanuman portrait (original artwork for Hanuman Run). Transparent background. -->
  <defs>
    <radialGradient id="skin" cx="0.45" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#FFD9C2"/><stop offset="0.6" stop-color="#F8B392"/><stop offset="1" stop-color="#EC9474"/>
    </radialGradient>
    <radialGradient id="skinBody" cx="0.5" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#FFD0B4"/><stop offset="1" stop-color="#E98E6C"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF3B0"/><stop offset="0.35" stop-color="#F6C443"/><stop offset="0.75" stop-color="#D9962A"/><stop offset="1" stop-color="#A9690F"/>
    </linearGradient>
    <linearGradient id="goldH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B87410"/><stop offset="0.3" stop-color="#F6C443"/><stop offset="0.5" stop-color="#FFF3B0"/><stop offset="0.7" stop-color="#F6C443"/><stop offset="1" stop-color="#B87410"/>
    </linearGradient>
    <radialGradient id="gadaHead" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#FFF6C4"/><stop offset="0.35" stop-color="#F6C443"/><stop offset="0.8" stop-color="#C47E16"/><stop offset="1" stop-color="#8E5208"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6A3A1C"/><stop offset="1" stop-color="#3E1E0C"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.5" cy="0.62" r="0.6">
      <stop offset="0" stop-color="#C47A3E"/><stop offset="0.55" stop-color="#7A3F18"/><stop offset="1" stop-color="#3A1A08"/>
    </radialGradient>
    <radialGradient id="ruby" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#FF8A96"/><stop offset="0.5" stop-color="#E8213A"/><stop offset="1" stop-color="#8E0A1E"/>
    </radialGradient>
    <radialGradient id="ear" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#F9B9A0"/><stop offset="1" stop-color="#EA8466"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <g stroke="#5A2A14" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">

    <!-- gada behind the shoulder (viewer's right) -->
    <g>
      <path d="M 742 1000 L 790 560" stroke="#7A4A0C" stroke-width="40"/>
      <path d="M 742 1000 L 790 560" stroke="url(#goldH)" stroke-width="30"/>
      <ellipse cx="768" cy="760" rx="26" ry="11" fill="url(#gold)" transform="rotate(-6 768 760)"/>
      <ellipse cx="785" cy="610" rx="30" ry="13" fill="url(#gold)" transform="rotate(-6 785 610)"/>
      <ellipse cx="810" cy="448" rx="100" ry="110" fill="url(#gadaHead)"/>
      <g fill="none" stroke="#A9690F" stroke-width="5" opacity="0.85">
        <path d="M 810 338 C 760 380, 760 516, 810 558"/>
        <path d="M 810 338 C 735 370, 718 530, 810 558" opacity="0.6"/>
        <path d="M 810 338 C 860 380, 860 516, 810 558"/>
        <path d="M 810 338 C 885 370, 902 530, 810 558" opacity="0.6"/>
        <path d="M 810 338 L 810 558"/>
      </g>
      <path d="M 712 448 Q 810 480 908 448" fill="none" stroke="#A9690F" stroke-width="8"/>
      <path d="M 712 448 Q 810 480 908 448" fill="none" stroke="#FFE9A0" stroke-width="3" stroke-linecap="round"/>
      <path d="M 788 340 L 810 290 L 832 340 Z" fill="url(#gold)"/>
      <circle cx="810" cy="282" r="12" fill="url(#gold)"/>
      <ellipse cx="780" cy="400" rx="26" ry="18" fill="#FFF8D8" stroke="none" opacity="0.75" filter="url(#soft)"/>
    </g>

    <!-- hair, back layer -->
    <path d="M 292 470 C 262 560, 252 690, 280 790 C 296 850, 330 892, 372 920 L 628 920 C 670 892, 704 850, 720 790 C 748 690, 738 560, 708 470 C 668 380, 332 380, 292 470 Z" fill="url(#hair)"/>
    <g fill="none" stroke="#8A5230" stroke-width="5" opacity="0.7">
      <path d="M 300 560 C 285 650, 292 760, 340 860"/>
      <path d="M 700 560 C 715 650, 708 760, 660 860"/>
      <path d="M 318 620 C 312 700, 322 780, 360 850"/>
      <path d="M 682 620 C 688 700, 678 780, 640 850"/>
    </g>

    <!-- shoulders & chest -->
    <path d="M 228 1000 C 236 912, 300 872, 392 856 L 440 800 L 560 800 L 608 856 C 700 872, 764 912, 772 1000 Z" fill="url(#skinBody)"/>
    <path d="M 262 960 C 280 930, 300 916, 322 908" fill="none" stroke="#C9704E" stroke-width="4" opacity="0.6"/>
    <path d="M 738 960 C 720 930, 700 916, 678 908" fill="none" stroke="#C9704E" stroke-width="4" opacity="0.6"/>
    <path d="M 404 868 Q 500 952 596 868" fill="none" stroke="#A9690F" stroke-width="14"/>
    <path d="M 404 868 Q 500 952 596 868" fill="none" stroke="#F6C443" stroke-width="8"/>
    <path d="M 378 892 Q 500 1000 622 892" fill="none" stroke="#A9690F" stroke-width="13"/>
    <path d="M 378 892 Q 500 1000 622 892" fill="none" stroke="#F6C443" stroke-width="7"/>
    <circle cx="500" cy="930" r="22" fill="url(#gold)"/>
    <circle cx="500" cy="930" r="13" fill="url(#ruby)" stroke-width="3"/>

    <!-- ears -->
    <ellipse cx="300" cy="588" rx="60" ry="74" fill="url(#ear)"/>
    <ellipse cx="308" cy="592" rx="32" ry="46" fill="#FBC7B2" stroke="#D97458" stroke-width="3"/>
    <ellipse cx="700" cy="588" rx="60" ry="74" fill="url(#ear)"/>
    <ellipse cx="692" cy="592" rx="32" ry="46" fill="#FBC7B2" stroke="#D97458" stroke-width="3"/>
    <!-- earrings -->
    <circle cx="300" cy="676" r="16" fill="url(#gold)"/><circle cx="300" cy="708" r="11" fill="url(#gold)"/>
    <circle cx="700" cy="676" r="16" fill="url(#gold)"/><circle cx="700" cy="708" r="11" fill="url(#gold)"/>

    <!-- face -->
    <path d="M 500 392 C 618 392, 700 470, 700 585 C 700 700, 615 782, 500 782 C 385 782, 300 700, 300 585 C 300 470, 382 392, 500 392 Z" fill="url(#skin)"/>
    <ellipse cx="500" cy="668" rx="118" ry="76" fill="#FFE4D2" stroke="none" opacity="0.85"/>
    <!-- blush -->
    <ellipse cx="386" cy="652" rx="46" ry="28" fill="#FF6F62" stroke="none" opacity="0.42" filter="url(#blur)"/>
    <ellipse cx="614" cy="652" rx="46" ry="28" fill="#FF6F62" stroke="none" opacity="0.42" filter="url(#blur)"/>

    <!-- fringe framing the face -->
    <path d="M 304 522 C 314 452, 392 422, 470 432 C 424 450, 384 480, 356 526 C 334 532, 314 530, 304 522 Z" fill="url(#hair)"/>
    <path d="M 696 522 C 686 452, 608 422, 530 432 C 576 450, 616 480, 644 526 C 666 532, 686 530, 696 522 Z" fill="url(#hair)"/>

    <!-- eyebrows -->
    <path d="M 392 500 Q 428 478 466 494" fill="none" stroke="#4E2814" stroke-width="9"/>
    <path d="M 608 500 Q 572 478 534 494" fill="none" stroke="#4E2814" stroke-width="9"/>

    <!-- eyes -->
    <g>
      <ellipse cx="428" cy="578" rx="52" ry="60" fill="#FFFFFF"/>
      <circle cx="434" cy="590" r="40" fill="url(#iris)" stroke="#3A1A08" stroke-width="3"/>
      <circle cx="436" cy="594" r="19" fill="#1A0A04" stroke="none"/>
      <circle cx="418" cy="572" r="13" fill="#FFFFFF" stroke="none"/>
      <circle cx="452" cy="610" r="6" fill="#FFFFFF" stroke="none"/>
      <path d="M 372 566 C 382 508, 472 502, 484 560" fill="none" stroke="#2A140A" stroke-width="11"/>
      <path d="M 376 556 L 356 542" fill="none" stroke="#2A140A" stroke-width="8"/>
    </g>
    <g>
      <ellipse cx="572" cy="578" rx="52" ry="60" fill="#FFFFFF"/>
      <circle cx="566" cy="590" r="40" fill="url(#iris)" stroke="#3A1A08" stroke-width="3"/>
      <circle cx="564" cy="594" r="19" fill="#1A0A04" stroke="none"/>
      <circle cx="550" cy="572" r="13" fill="#FFFFFF" stroke="none"/>
      <circle cx="584" cy="610" r="6" fill="#FFFFFF" stroke="none"/>
      <path d="M 628 566 C 618 508, 528 502, 516 560" fill="none" stroke="#2A140A" stroke-width="11"/>
      <path d="M 624 556 L 644 542" fill="none" stroke="#2A140A" stroke-width="8"/>
    </g>

    <!-- nose & smile -->
    <ellipse cx="500" cy="642" rx="24" ry="17" fill="#EC6F5C" stroke="#B9483A" stroke-width="3"/>
    <ellipse cx="493" cy="636" rx="7" ry="4" fill="#FFFFFF" stroke="none" opacity="0.7"/>
    <path d="M 456 684 Q 500 728 544 684 Q 500 702 456 684 Z" fill="#C0392B" stroke="#7A1E14" stroke-width="5"/>
    <path d="M 478 704 Q 500 716 522 704 Q 500 698 478 704 Z" fill="#FF8A80" stroke="none"/>

    <!-- tilak -->
    <path d="M 486 452 Q 488 498 500 504 Q 512 498 514 452" fill="none" stroke="#FFFFFF" stroke-width="8"/>
    <path d="M 500 460 L 500 494" fill="none" stroke="#E01818" stroke-width="6"/>

    <!-- crown: tiers -->
    <path d="M 366 430 L 398 330 L 602 330 L 634 430 Z" fill="url(#gold)"/>
    <path d="M 406 336 L 432 248 L 568 248 L 594 336 Z" fill="url(#gold)"/>
    <path d="M 440 254 L 500 112 L 560 254 Z" fill="url(#gold)"/>
    <rect x="392" y="318" width="216" height="22" rx="10" fill="#E8A92E"/>
    <rect x="426" y="238" width="148" height="20" rx="9" fill="#E8A92E"/>
    <circle cx="500" cy="104" r="17" fill="url(#gold)"/>
    <path d="M 492 90 L 500 60 L 508 90 Z" fill="url(#gold)"/>
    <g fill="url(#ruby)" stroke-width="3">
      <circle cx="430" cy="290" r="9"/><circle cx="570" cy="290" r="9"/>
      <circle cx="500" cy="200" r="9"/>
    </g>
    <!-- side swirls -->
    <g fill="none" stroke="#A9690F" stroke-width="9">
      <path d="M 352 408 C 330 380, 352 352, 378 366 C 396 378, 386 400, 368 394"/>
      <path d="M 648 408 C 670 380, 648 352, 622 366 C 604 378, 614 400, 632 394"/>
    </g>
    <g fill="none" stroke="#FFE08A" stroke-width="4">
      <path d="M 352 408 C 330 380, 352 352, 378 366 C 396 378, 386 400, 368 394"/>
      <path d="M 648 408 C 670 380, 648 352, 622 366 C 604 378, 614 400, 632 394"/>
    </g>
    <!-- crown band across the forehead -->
    <path d="M 314 438 Q 500 368 686 438 L 678 474 Q 500 410 322 474 Z" fill="url(#gold)"/>
    <g fill="url(#ruby)" stroke-width="3">
      <circle cx="380" cy="433" r="9"/><circle cx="436" cy="417" r="9"/><circle cx="564" cy="417" r="9"/><circle cx="620" cy="433" r="9"/>
    </g>
    <!-- central plate with ruby -->
    <path d="M 500 296 C 550 326, 566 384, 544 444 L 456 444 C 434 384, 450 326, 500 296 Z" fill="url(#gold)"/>
    <path d="M 500 318 C 538 344, 548 388, 532 432 L 468 432 C 452 388, 462 344, 500 318 Z" fill="none" stroke="#A9690F" stroke-width="4"/>
    <path d="M 500 336 C 528 362, 530 398, 500 420 C 470 398, 472 362, 500 336 Z" fill="url(#ruby)" stroke="#7A0A18" stroke-width="4"/>
    <ellipse cx="491" cy="366" rx="7" ry="11" fill="#FFFFFF" stroke="none" opacity="0.75"/>
    <!-- metal shine -->
    <path d="M 478 150 L 462 236" fill="none" stroke="#FFFBE0" stroke-width="6" stroke-opacity="0.75"/>
  </g>
</svg>
